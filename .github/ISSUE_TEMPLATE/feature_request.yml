name: Feature request
description: Propose a change to the Community Edition
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The Community Edition is a command-line tool. The management daemon, dashboard,
        API and entitlements are part of the separate Enterprise Edition
        ([editions](https://certistack.dev/docs/editions/)); send requests for those to
        sales@certistack.dev.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: A CLI flag, plan field, report field, documentation or deployment change. Include an example plan snippet if relevant.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: How does the change affect the safety guarantees (read-only backups, an isolated sandbox, verified cleanup, a report of every run)? See https://certistack.dev/docs/#safety.
    validations:
      required: false
  - type: checkboxes
    id: cla
    attributes:
      label: Contribution
      options:
        - label: I may open a pull request for this, and I understand it requires signing the CLA (CLA.md).
