name: Bug report
description: A reproducible defect in the Community CLI, docs, or deployment files
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not file security vulnerabilities here**; follow
        [SECURITY.md](../blob/main/SECURITY.md) instead. Never paste credentials,
        PBS repository strings, signing keys, or reports from a real environment.
  - type: input
    id: version
    attributes:
      label: CertiStack version
      description: Output of `certistack version` (all five lines).
      placeholder: certistack v0.1.0 / commit abc1234 / built 2026-… / go1.26 / linux/amd64
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Proxmox VE and PBS versions
      placeholder: PVE 9.0 (kernel 6.14) / PBS 4.0 / proxmox-backup-client 4.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Controller host (native binary)
        - Controller container (deploy/controller)
        - Temporary node worker on PVE
        - Documentation or website
        - Build / CI / packaging
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, a redacted plan (RFC 5737 addresses), and the environment-file keys used (values redacted).
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and `--debug` output
      description: Run the failing command with `--debug` and paste the relevant lines. Redact hostnames and secrets.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran this in a dedicated lab or staging environment, not on a production hypervisor.
          required: true
        - label: I removed credentials, repository strings, private-key paths, and customer data from everything above.
          required: true
