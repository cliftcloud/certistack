name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    # Dependabot's pull requests are exempt by the account that opened them,
    # identified by its immutable ID (49699333), never by a name a commit can
    # claim: the action has no allowlist, so every commit author in any other
    # pull request must have signed.
    if: >
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.user.id != 49699333) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.user.id != 49699333 &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The pinned action reads only the first 100 commits of a pull request
      # and would pass one whose later commits have an unsigned author.
      - name: Refuse pull requests the CLA check cannot read in full
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          commits=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .commits)
          if [[ ! "$commits" =~ ^[0-9]+$ ]]; then
            echo "Could not read the pull request's commit count: $commits" >&2
            exit 1
          fi
          if (( commits > 100 )); then
            echo "This pull request has $commits commits. The CLA check reads only the first 100, so it cannot pass; squash or split the pull request." >&2
            exit 1
          fi

      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not needed, and normally unset. The action reads this token only
          # when remote-organization-name or remote-repository-name is set
          # (signatures kept in another repository); here both are empty, so it
          # writes the signature file with GITHUB_TOKEN, to the cla-signatures
          # branch, which no branch rule covers. The branch must exist: the
          # action creates the file but not the branch.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT_PAT }}
        with:
          path-to-signatures: "signatures/cla-v1.json"
          path-to-document: "https://github.com/cliftcloud/certistack/blob/main/CLA.md"
          # Signatures are stored on a dedicated orphan branch so they never
          # mix with source history.
          branch: "cla-signatures"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: >
            Thank you for the contribution! Before this can be merged, please
            sign our [Contributor License Agreement](CLA.md) by commenting
            below with the exact text: "I have read the CLA Document and I
            hereby sign the CLA"
          remote-organization-name: ""
          remote-repository-name: ""
